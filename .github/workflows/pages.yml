name: Publish dashboard

# Publishes dashboard/ to GitHub Pages:
#   https://vrushablanjekar.github.io/DPFP-Project/
# Runs after every daily pipeline run (which rebuilds the dashboard),
# whenever the dashboard files are pushed, or by hand from the Actions tab.
on:
  workflow_run:
    workflows: ["DPFP daily pipeline"]
    types: [completed]
  push:
    branches: [main]
    paths: ["dashboard/**"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main   # the daily run commits the new dashboard to main; publish that

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

      - id: deploy
        uses: actions/deploy-pages@v4
