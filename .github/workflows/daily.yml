name: DPFP daily pipeline

# Every day at 08:00 India time (02:30 UTC): fetch any new days for Pune + Delhi.
# On Sundays (India time) run_daily.py also retrains the model.
# Run it by hand any time from the Actions tab ("Run workflow").
on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      force_retrain:
        description: "Retrain the model now, even if it is not Sunday"
        type: boolean
        default: false

# Only one run at a time, so two runs can never write the same logs.
concurrency:
  group: dpfp-daily
  cancel-in-progress: false

permissions:
  contents: write   # lets the job commit the new data back to the repo

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Fetch new data (and retrain on Sundays)
        id: pipeline
        run: |
          if [ "${{ inputs.force_retrain }}" = "true" ]; then
            python run_daily.py --force-retrain
          else
            python run_daily.py
          fi

      # Rebuild the Pipeline Radar dashboard (dashboard/index.html) and log today's forecast.
      # Runs even if the retrain step failed; a dashboard error never blocks saving the data.
      - name: Build dashboard
        if: always()
        continue-on-error: true
        run: python build_dashboard.py

      # Runs even if the retrain step failed, so the fetched data is never lost.
      - name: Save new data to the repo
        if: always()
        run: |
          git config user.name "dpfp-bot"
          git config user.email "dpfp-bot@users.noreply.github.com"
          git add -A data database logs outputs dashboard
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Daily run $(TZ=Asia/Kolkata date +%F)"
            git push
          fi
